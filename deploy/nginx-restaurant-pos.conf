# OPTIONAL — domain + HTTPS chahiye to ye nginx site config hai.
# /etc/nginx/sites-available/restaurant-pos me rakho, phir:
#   sudo ln -s /etc/nginx/sites-available/restaurant-pos /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d yourdomain.com
# Bina domain ke (sirf IP se) chala rahe ho to nginx skip karo —
# gunicorn seedha port 5001 pe serve karega.

# IP-only deployment (no domain yet). Domain aaye to server_name badal kar
# certbot --nginx chalao — https://README-DEPLOY.md Step 5
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 10M;   # dish photo upload
}
