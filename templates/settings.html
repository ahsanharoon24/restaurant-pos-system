{% extends 'base.html' %}
{% block title %}Settings — {{ settings.restaurant_name }}{% endblock %}
{% block content %}
<h1>⚙️ Settings</h1>
<div class="panel" style="max-width:600px;">
  <form method="post">
    <label>Restaurant Name *</label>
    <input type="text" name="restaurant_name" value="{{ s.restaurant_name }}" required>
    <label>Address</label>
    <input type="text" name="address" value="{{ s.address }}">
    <label>Phone</label>
    <input type="text" name="phone" value="{{ s.phone }}">
    <label>GST %</label>
    <input type="number" step="0.01" name="gst_percent" value="{{ s.gst_percent }}">
    <label>Receipt Footer</label>
    <input type="text" name="receipt_footer" value="{{ s.receipt_footer }}">
    <br><br>
    <button class="btn btn-primary">💾 Save</button>
  </form>
</div>
{% endblock %}
