{% extends 'base.html' %}
{% block title %}Change Password — {{ settings.restaurant_name }}{% endblock %}
{% block content %}
<h1>🔑 Change Password</h1>
<div class="panel" style="max-width:400px;">
  <form method="post">
    <label>Old Password</label>
    <div class="pw-field"><input type="password" name="old_password" required><button type="button" class="pw-eye" tabindex="-1" title="Show password">👁</button></div>
    <label>New Password (min 6)</label>
    <div class="pw-field"><input type="password" name="new_password" required><button type="button" class="pw-eye" tabindex="-1" title="Show password">👁</button></div>
    <label>Confirm New Password</label>
    <div class="pw-field"><input type="password" name="confirm_password" required><button type="button" class="pw-eye" tabindex="-1" title="Show password">👁</button></div>
    <br><br>
    <button class="btn btn-primary">Change</button>
  </form>
</div>
{% endblock %}
